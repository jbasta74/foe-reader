name: Testy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04 # Playwright zatím nepodporuje ubuntu-latest (26.04)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright (Chromium)
        run: |
          npm i --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Testy panelu
        run: node test/run-tests.mjs
